<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', monospace; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="320" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="30" y="38" fill="#94a3b8" font-size="12" class="mono" font-weight="700" letter-spacing="2">SYSTEM TOPOLOGY // CORE ARCHITECTURE MATRIX</text>
  <line x1="30" y1="50" x2="850" y2="50" stroke="#1e293b" stroke-width="1" />

  <!-- Node 1: FormPilot (Cyan) -->
  <g transform="translate(30, 68)">
    <rect width="255" height="225" rx="10" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#00f2fe" fill-opacity="0.12" />
    <circle cx="20" cy="17" r="4" fill="#00f2fe" />
    <text x="32" y="22" fill="#00f2fe" font-size="13" class="mono" font-weight="700">01 // FORMPILOT</text>
    
    <text x="18" y="58" fill="#e2e8f0" font-size="13" class="title">Autonomous Browser Agent</text>
    <text x="18" y="78" fill="#94a3b8" font-size="11" class="mono">Multi-Agent Browser Automation</text>

    <!-- Pipeline flowchart boxes -->
    <rect x="18" y="98" width="219" height="26" rx="5" fill="#131e33" stroke="#2563eb" stroke-width="1" />
    <text x="127" y="115" fill="#93c5fd" font-size="10" class="mono" text-anchor="middle">React 19 + Vite UI Dashboard</text>
    <text x="127" y="136" fill="#00f2fe" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="142" width="219" height="26" rx="5" fill="#131e33" stroke="#00f2fe" stroke-width="1" />
    <text x="127" y="159" fill="#00f2fe" font-size="10" class="mono" text-anchor="middle">FastAPI + Pydantic Agent Engine</text>
    <text x="127" y="180" fill="#00f2fe" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="186" width="219" height="26" rx="5" fill="#131e33" stroke="#38bdf8" stroke-width="1" />
    <text x="127" y="203" fill="#38bdf8" font-size="10" class="mono" text-anchor="middle">Playwright Sandboxed Execution</text>
  </g>

  <!-- Node 2: BEUVAULT Ecosystem (Purple) -->
  <g transform="translate(312, 68)">
    <rect width="255" height="225" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#a855f7" fill-opacity="0.12" />
    <circle cx="20" cy="17" r="4" fill="#c084fc" />
    <text x="32" y="22" fill="#c084fc" font-size="13" class="mono" font-weight="700">02 // BEUVAULT SUITE</text>

    <text x="18" y="58" fill="#e2e8f0" font-size="13" class="title">Academic Analytics Pipeline</text>
    <text x="18" y="78" fill="#94a3b8" font-size="11" class="mono">Real-time Ingestion &amp; Intelligence</text>

    <rect x="18" y="98" width="219" height="26" rx="5" fill="#1e1333" stroke="#7e22ce" stroke-width="1" />
    <text x="127" y="115" fill="#d8b4fe" font-size="10" class="mono" text-anchor="middle">Watcher Daemon &amp; Result Extractor</text>
    <text x="127" y="136" fill="#c084fc" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="142" width="219" height="26" rx="5" fill="#1e1333" stroke="#a855f7" stroke-width="1" />
    <text x="127" y="159" fill="#c084fc" font-size="10" class="mono" text-anchor="middle">Supabase PostgreSQL + Vector Data</text>
    <text x="127" y="180" fill="#c084fc" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="186" width="219" height="26" rx="5" fill="#1e1333" stroke="#c084fc" stroke-width="1" />
    <text x="127" y="203" fill="#e9d5ff" font-size="10" class="mono" text-anchor="middle">Next.js 16 Predictive Engine + PDF</text>
  </g>

  <!-- Node 3: Drishti & Vigil Drive (Emerald) -->
  <g transform="translate(595, 68)">
    <rect width="255" height="225" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#10b981" fill-opacity="0.12" />
    <circle cx="20" cy="17" r="4" fill="#34d399" />
    <text x="32" y="22" fill="#34d399" font-size="13" class="mono" font-weight="700">03 // DRISHTI / VIGIL</text>

    <text x="18" y="58" fill="#e2e8f0" font-size="13" class="title">Vision ADAS &amp; Hardware Bridge</text>
    <text x="18" y="78" fill="#94a3b8" font-size="11" class="mono">Edge Computer Vision &amp; Telemetry</text>

    <rect x="18" y="98" width="219" height="26" rx="5" fill="#0f291e" stroke="#047857" stroke-width="1" />
    <text x="127" y="115" fill="#6ee7b7" font-size="10" class="mono" text-anchor="middle">Real-time Camera Video Stream</text>
    <text x="127" y="136" fill="#34d399" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="142" width="219" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-width="1" />
    <text x="127" y="159" fill="#34d399" font-size="10" class="mono" text-anchor="middle">MediaPipe FaceMesh + OpenCV</text>
    <text x="127" y="180" fill="#34d399" font-size="11" class="mono" text-anchor="middle">↓</text>
    <rect x="18" y="186" width="219" height="26" rx="5" fill="#0f291e" stroke="#34d399" stroke-width="1" />
    <text x="127" y="203" fill="#a7f3d0" font-size="10" class="mono" text-anchor="middle">Arduino Driver Alert Telemetry</text>
  </g>
</svg>
